name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Print versions
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          xcodebuild -version
          xcrun swift --version
          xcrun simctl list runtimes
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4
          install: true
          cache: true
      - run: just ci-test BlocklogUnit
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-failure
          path: |
            build/logs/
            build/results/
          retention-days: 7

  ui:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Print versions
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          xcodebuild -version
          xcrun swift --version
          xcrun simctl list runtimes
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.4
          install: true
          cache: true
      - run: just ci-test BlocklogUI
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-failure
          path: |
            build/logs/
            build/results/
          retention-days: 7
